# DataTalker — one container serves the API + the built UI.
# Build context is the repo root (the root Dockerfile is multi-stage: bun builds the
# frontend, then the API image serves it). Needs backend/.env with GEMINI_API_KEY (or
# LLM_PROVIDER=openai + LLM_* settings) and DATATALKER_API_KEY.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    volumes:
      - datatalker-data:/app/backend/data
      - datatalker-logs:/app/backend/logs
    restart: unless-stopped

volumes:
  datatalker-data:
  datatalker-logs:
