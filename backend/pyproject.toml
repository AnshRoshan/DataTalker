[project]
name = "talktodata"
version = "0.1.0"
description = "DataTalker - chat with your database in natural language"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.30.0",
    "cachetools>=5.5.2",
    "faker>=37.3.0",
    "fastapi>=0.115.12",
    "langgraph>=0.4.7",
    "pandas>=2.2.3",
    "psycopg2-binary>=2.9.10",
    "pydantic-settings>=2.15.0",
    "pymysql>=1.2.0",
    "python-dotenv>=1.1.0",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    "sqlalchemy>=2.0.41",
    "uvicorn>=0.34.2",
]
