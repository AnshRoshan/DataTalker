# Runs the live DataTalker API. Needs backend/.env with GEMINI_API_KEY and
# DATATALKER_API_KEY. External databases are reached via db_connection_string at request
# time, so no bundled Postgres/Redis/Celery is needed (that stack was dead code — removed).
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
